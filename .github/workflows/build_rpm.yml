name: Build RPM

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - release/**
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build-rpm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout package files
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            bashtester
            bashtester.spec
          sparse-checkout-cone-mode: false

      - name: Install RPM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Get latest release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          version="${latest_tag#v}"

          if [[ -z "$version" ]]; then
            echo "Latest release tag did not contain a version" >&2
            exit 1
          fi

          echo "RPM_VERSION=$version" >> "$GITHUB_ENV"
          echo "Using RPM version $version from release $latest_tag"

      - name: Build RPM package
        run: |
          top_dir="$GITHUB_WORKSPACE/rpmbuild"
          source_dir="$top_dir/SOURCES"
          rpm_dir="$GITHUB_WORKSPACE/target"

          mkdir -p "$source_dir" "$top_dir/BUILD" "$top_dir/BUILDROOT" "$top_dir/SPECS" "$top_dir/SRPMS" "$rpm_dir"
          install -m 0755 bashtester "$source_dir/bashtester"

          rpmbuild \
            --define "_topdir $top_dir" \
            --define "_sourcedir $source_dir" \
            --define "_rpmdir $rpm_dir" \
            --define "version $RPM_VERSION" \
            --noclean \
            -bb bashtester.spec

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: bashtester-rpm-${{ env.RPM_VERSION }}
          path: target/**/*.rpm
          if-no-files-found: error
