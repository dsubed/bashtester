name: Build RPM

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - release/**
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build-rpm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout package files
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            version
            bashtester
            bashtester.spec
          sparse-checkout-cone-mode: false

      - name: Install RPM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build RPM package
        run: ./build.sh

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: bashtester-rpm
          path: output/*.rpm
          archive: false
          if-no-files-found: error
